# Each run checks once a minute for about 5 minutes. The snapshot is committed
# and pushed after every check. Pages is published once, in its own job, so a
# deploy stuck on purging_cdn cannot cancel the save. The 5-minute schedule is
# only a backup.

name: Check pickup stock

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# The checker waits its turn. A new run does not cancel one that is still saving.
concurrency:
  group: iphone-duo-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      GIT_BASELINE_FILE: /tmp/availability.git.json
      GIT_HISTORY_FILE: /tmp/history.git.json
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Keep the committed baseline aside
        run: |
          mkdir -p /tmp
          if [ -f state/availability.json ]; then
            cp state/availability.json /tmp/availability.git.json
          fi
          if [ -f state/history.json ]; then
            cp state/history.json /tmp/history.git.json
          fi

      - name: Restore the latest saved baseline
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: state
          key: stock-baseline-${{ github.run_id }}
          restore-keys: |
            stock-baseline-

      - name: Run offline tests
        run: python3 -m unittest -v test_check.py

      - name: Minute 1
        uses: ./.github/actions/round
        with:
          pause: "true"

      - name: Minute 2
        uses: ./.github/actions/round
        with:
          pause: "true"

      - name: Minute 3
        uses: ./.github/actions/round
        with:
          pause: "true"

      - name: Minute 4
        uses: ./.github/actions/round
        with:
          pause: "true"

      - name: Minute 5
        uses: ./.github/actions/round
        with:
          pause: "false"

      - name: Upload the webpage
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          name: github-pages

      - name: Save the notification baseline
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: state
          key: stock-baseline-${{ github.run_id }}

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: iphone-duo-stock-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish the latest webpage
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000

  # GITHUB_TOKEN cannot start a run with a normal push, but it can with
  # workflow_dispatch. That keeps the checks going when GitHub's scheduler does not.
  queue-next:
    needs: [check, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Start the next check
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'check.yml',
              ref: 'main'
            })
            core.info('Requested the next stock check on main.')
