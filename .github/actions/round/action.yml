name: Check and save
description: Check pickup stock once, commit the snapshot, then optionally wait so the next check is about a minute later.

inputs:
  pause:
    description: Wait after saving so checks stay about a minute apart
    required: true
    default: "true"

runs:
  using: composite
  steps:
    - name: Check Apple pickup stock
      shell: bash
      run: python3 check.py --once

    - name: Save this check
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add state/availability.json state/history.json docs/data.json
        if git diff --cached --quiet; then
          echo "Nothing new to commit."
        else
          git commit -m "Update pickup stock snapshot"
          if ! git push; then
            echo "::warning title=Could not save stock history::This check could not be pushed. The next check will try again. In the repo, open Settings, then Actions, then General, then Workflow permissions, and choose Read and write permissions."
          fi
        fi

    - name: Wait for the next minute
      if: inputs.pause == 'true'
      shell: bash
      run: python3 check.py --pause
